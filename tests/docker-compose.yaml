services:
  main:
    build:
      context: ..
      dockerfile: environment/mcp-server/Dockerfile
      target: verifier
    user: "10001:10001"
    environment:
      FEATURE_VERIFIER_RUNTIME_ROOT: /exchange/runtime
      FEATURE_WORKER_SOCKET: /exchange/worker.sock
    volumes:
      - verifier-exchange:/exchange
    depends_on:
      model-worker:
        condition: service_healthy

  worker-volume-init:
    build:
      context: ..
      dockerfile: environment/mcp-server/Dockerfile
      target: worker
    user: "0:0"
    command:
      - sh
      - -c
      - chmod 0770 /exchange && chown -R 10001:10001 /exchange
    volumes:
      - verifier-exchange:/exchange
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32

  model-worker:
    build:
      context: ..
      dockerfile: environment/mcp-server/Dockerfile
      target: worker
    user: "10001:10001"
    depends_on:
      worker-volume-init:
        condition: service_completed_successfully
    command: ["feature-engineering-worker-server"]
    environment:
      FEATURE_WORKER_ROOT: /exchange/runtime
      FEATURE_WORKER_SOCKET: /exchange/worker.sock
    volumes:
      - verifier-exchange:/exchange
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "feature-engineering-worker-server", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  verifier-exchange:
