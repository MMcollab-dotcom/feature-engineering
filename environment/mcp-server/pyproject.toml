[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-engineering"
version = "1.0.0"
description = "Fixed Harbor feature-engineering task."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp==3.4.5",
  "joblib==1.5.3",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "pydantic==2.13.4",
  "pyarrow==25.0.0",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "PyYAML==6.0.3",
  "setuptools==80.9.0",
  "wheel==0.45.1",
]

[project.scripts]
feature-engineering-verify = "feature_engineering.evaluation.verifier:main"
feature-engineering-mcp = "feature_engineering.mcp_server:main"
feature-engineering-worker-server = "evalenv_shared.worker.socket_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["feature_engineering*", "evalenv_shared*"]
